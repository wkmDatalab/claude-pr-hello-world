name: Agent Review Artifacts

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  review:
    name: Run tests and Claude agent review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run pytest baseline
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m pytest -q | tee reports/pytest-output.txt

      - name: Run Claude agent review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/agent_review.py

      - name: Show generated files
        if: always()
        run: |
          echo "Generated report files:"
          find reports -maxdepth 3 -type f -print || true

      - name: Post agent review as a PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- claude-agent-review -->';
            const reportPath = 'reports/AGENT_REVIEW.md';

            let report;
            if (fs.existsSync(reportPath)) {
              report = fs.readFileSync(reportPath, 'utf8').trim();
            } else {
              report = '_No agent review was generated for this run (check the workflow logs and the `ANTHROPIC_API_KEY` secret)._';
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const footer = `\n\n---\n<sub>🤖 Generated by the Claude Agent SDK in [this workflow run](${runUrl}). This comment updates in place on each push.</sub>`;

            // GitHub caps comment bodies at 65536 chars; leave headroom for marker + footer.
            const MAX = 65000;
            if (report.length > MAX) {
              report = report.slice(0, MAX) + '\n\n_…report truncated; see the uploaded artifact for the full version._';
            }

            const body = `${marker}\n${report}${footer}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated existing review comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created new review comment');
            }

      - name: Upload agent review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-review-${{ github.run_id }}
          path: reports/**
          retention-days: 14
