name: Claude Review On Push

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Mapped so the email step can gate on it — the `secrets` context is not
    # available in a step-level `if:`, but `env` is.
    env:
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        run: |
          pip install claude-agent-sdk python-dotenv

      - name: Run Claude review
        run: |
          python claude_review.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Ensure report files exist
        if: always()
        run: |
          mkdir -p reports traceability
          [ -f reports/AGENT_REVIEW.md ] || echo "No report generated — the review step failed before writing output. See the run log." > reports/AGENT_REVIEW.md
          [ -f reports/SUGGESTED_FIX.patch ] || : > reports/SUGGESTED_FIX.patch
          [ -f traceability/run.json ] || echo '{}' > traceability/run.json

      - name: Add review to GitHub Actions summary
        if: always()
        run: |
          echo "# Claude Code Review" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f reports/AGENT_REVIEW.md ]; then
            cat reports/AGENT_REVIEW.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Claude report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s reports/SUGGESTED_FIX.patch ]; then
            echo "<details><summary>Proposed fix (reports/SUGGESTED_FIX.patch)</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            cat reports/SUGGESTED_FIX.patch >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No patch proposed._" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All files (report, patch, trace) are in the **claude-review-${{ github.run_id }}** artifact below." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-review-${{ github.run_id }}
          path: |
            reports/**
            traceability/**

      # Emails the review report + patch on every run; the subject carries the
      # job status, so this doubles as the failure alert. Requires the MAIL_*
      # secrets below (e.g. a Gmail account + app password). If they are unset
      # the step is skipped, so the workflow still works without email.
      - name: Email the review
        if: always() && env.MAIL_SERVER != ''
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Claude Review <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Claude review [${{ job.status }}] — ${{ github.ref_name }} @ ${{ github.sha }}"
          body: |
            Claude review for ${{ github.repository }} on ${{ github.ref_name }} (${{ job.status }}).

            Commit: ${{ github.sha }}
            Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The report, proposed patch, and run trace are attached.
          attachments: reports/AGENT_REVIEW.md,reports/SUGGESTED_FIX.patch,traceability/run.json